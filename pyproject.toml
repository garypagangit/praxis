[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "praxis"
version = "0.1.0"
description = "Starter workspace for local development and Colab-backed model runs."
readme = "README.md"
requires-python = ">=3.11"

[project.scripts]
praxis-train = "praxis.train:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
