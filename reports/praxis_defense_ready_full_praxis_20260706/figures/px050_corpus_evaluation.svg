<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="600" viewBox="0 0 1040 600" role="img" aria-labelledby="title desc">
  <title id="title">PX-050 Corpus Evaluation</title>
  <desc id="desc">Corpus and policy evaluation for PX-050 two-model dry-run live-agent tool calls.</desc>
  <rect width="1040" height="600" fill="#ffffff"/>
  <text x="40" y="46" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#111827">PX-050 Corpus Evaluation</text>
  <text x="40" y="76" font-family="Arial, sans-serif" font-size="14" fill="#374151">Combined Qwen/DeepSeek dry-run live-agent corpus: 288 rows, 128 invalid, 160 valid.</text>
  <g font-family="Arial, sans-serif" font-size="13" fill="#111827">
    <text x="60" y="125" font-size="16" font-weight="700">Rows by model</text>
    <rect x="90" y="155" width="115" height="144" fill="#2563eb"/>
    <rect x="245" y="155" width="115" height="144" fill="#10b981"/>
    <text x="103" y="322">Qwen 144</text>
    <text x="247" y="322">DeepSeek 144</text>
    <text x="80" y="345">Each: 64 invalid, 80 valid</text>

    <text x="470" y="125" font-size="16" font-weight="700">Invalid allows by policy</text>
    <line x1="470" y1="300" x2="900" y2="300" stroke="#9ca3af"/>
    <rect x="520" y="170" width="70" height="130" fill="#ef4444"/>
    <rect x="650" y="280" width="70" height="20" fill="#f59e0b"/>
    <rect x="780" y="300" width="70" height="0" fill="#059669"/>
    <text x="507" y="322">Allow-all</text>
    <text x="640" y="322">Registry</text>
    <text x="772" y="322">Hardened</text>
    <text x="525" y="160">128</text>
    <text x="670" y="270">20</text>
    <text x="805" y="290">0</text>

    <text x="60" y="405" font-size="16" font-weight="700">Mode distribution</text>
    <rect x="60" y="430" width="180" height="18" fill="#e5e7eb"/>
    <rect x="60" y="430" width="45" height="18" fill="#2563eb"/>
    <text x="255" y="444">direct 72</text>
    <rect x="60" y="460" width="200" height="18" fill="#e5e7eb"/>
    <rect x="60" y="460" width="50" height="18" fill="#10b981"/>
    <text x="275" y="474">manager_variant 80</text>
    <rect x="60" y="490" width="190" height="18" fill="#e5e7eb"/>
    <rect x="60" y="490" width="47" height="18" fill="#a855f7"/>
    <text x="265" y="504">version_pin 76</text>
    <rect x="60" y="520" width="110" height="18" fill="#e5e7eb"/>
    <rect x="60" y="520" width="40" height="18" fill="#f59e0b"/>
    <text x="185" y="534">remote/shell/mixed 60</text>

    <text x="470" y="405" font-size="16" font-weight="700">Defense interpretation</text>
    <text x="470" y="435">Registry-only misses remote-source policy risk: 20 invalid allows.</text>
    <text x="470" y="462">Hardened gate: 0 invalid allows and 160/160 valid allows.</text>
    <text x="470" y="489">Zero observed escapes over 128 invalid rows implies a 95% one-sided upper bound near 2.31%.</text>
    <text x="470" y="516">Claim remains dry-run, no-execution, PyPI/NPM install-boundary only.</text>
  </g>
</svg>
